<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Pilotos</title>

  <style>

    body{
      font-family: Arial, Helvetica, sans-serif;
      background:#f5f5f5;
      text-align:center;
    }

    h1{
      margin-top:40px;
    }

    .info{
      margin-bottom:20px;
    }

    a{
      text-decoration:none;
      color:white;
      background:#e10600;
      padding:8px 15px;
      border-radius:5px;
    }

    a:hover{
      background:#ff2a2a;
    }

    table{
      margin:auto;
      border-collapse:collapse;
      width:80%;
      background:white;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    th{
      background:#e10600;
      color:white;
      padding:10px;
    }

    td{
      padding:10px;
      border-bottom:1px solid #ddd;
    }

    tr:hover{
      background:#f2f2f2;
    }

  </style>

</head>
<body>

<h1>🏎️ Grid de Pilotos</h1>

<div class="info">

  <p>
    Estrutura selecionada:
    <strong th:text="${estruturaSelecionada}"></strong>
  </p>

  <a href="/">Voltar</a>

</div>

<table>

  <thead>
  <tr>
    <th>ID</th>
    <th>Nome</th>
    <th>Nacionalidade</th>
    <th>Idade</th>
    <th>Equipe</th>
    <th>Motor</th>
    <th>Pontos</th>
  </tr>
  </thead>

  <tbody>

  <tr th:each="piloto : ${pilotos}">
    <td th:text="${piloto.id}"></td>
    <td th:text="${piloto.nome}"></td>
    <td th:text="${piloto.nacionalidade}"></td>
    <td th:text="${piloto.idade}"></td>
    <td th:text="${piloto.equipe}"></td>
    <td th:text="${piloto.motor}"></td>
    <td th:text="${piloto.pontos}"></td>
  </tr>

  </tbody>

</table>

</body>
</html>
